name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify
        env:
          SALESFORCE_BASE_URL: "https://ci.example.invalid"
          SALESFORCE_CLIENT_ID: "ci-test-client-id"
          SALESFORCE_CLIENT_SECRET: "ci-test-client-secret"
          SALESFORCE_API_VERSION: "v64.0"