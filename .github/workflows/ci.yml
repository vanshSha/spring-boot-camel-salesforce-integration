name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Download OpenTelemetry Java Agent
        run: |
          curl -L \
            -o opentelemetry-javaagent.jar \
            https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.31.1/opentelemetry-javaagent-2.31.1.jar

      - name: Verify OpenTelemetry Java Agent
        run: ls -lh opentelemetry-javaagent.jar

      - name: Build Docker image
        run: docker build -t salesforce-integration-service:${{ github.sha }} .