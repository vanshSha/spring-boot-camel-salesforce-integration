spring.application.name=salesforce_integration_service

# OAuth test defaults
salesforce.client-id=${SALESFORCE_CLIENT_ID:ci-test-client-id}
salesforce.client-secret=${SALESFORCE_CLIENT_SECRET:ci-test-client-secret}
salesforce.username=${SALESFORCE_USERNAME:ci-test-username}
salesforce.password=${SALESFORCE_PASSWORD:ci-test-password}

# Salesforce base URL test default
salesforce.base-url=${SALESFORCE_BASE_URL:https://ci.example.invalid}

# Apex REST endpoint
salesforce.apex-endpoint=/services/apexrest/name-splitter/

# Camel
camel.springboot.main-run-controller=true
